<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YTSponsorSkip settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="settings-page">
    <main class="panel">
      <p class="eyebrow">YTSponsorSkip</p>
      <h1>Settings</h1>
      <p class="lede">Choose how the extension handles detected promotional interruptions.</p>

      <form id="settings-form">
        <label class="toggle-row">
          <span><strong>Experimental automatic skipping</strong>
            <small>Off by default. Uses contextual Conservative predictions on supported English prerecorded videos. Predictions can be wrong. Every skip offers Undo.</small></span>
          <input id="experimental-auto-skip" type="checkbox">
        </label>
        <label class="toggle-row">
          <span>
            <strong>Preview detected promotions</strong>
            <small>Off by default. Shows predictions only; it never seeks or skips.</small>
          </span>
          <input id="preview-detected-promotions" type="checkbox">
        </label>

        <label class="stacked" for="preview-transcript-source">
          <strong>Transcript source for preview or experimental skipping</strong>
          <select id="preview-transcript-source">
            <option value="saved">Saved reviewed-tune transcript (no API request)</option>
            <option value="supadata">Supadata native captions (uses free credits)</option>
          </select>
          <small>Only the 14 reviewed tune videos are available in saved mode. Supadata requires a local backend key and consumes a trial attempt on a cache miss.</small>
        </label>

        <p class="preview-warning">Choose preview or experimental skipping. Experimental skipping uses Conservative only. Playback continues while detection runs.</p>

        <label class="toggle-row">
          <span>
            <strong>Enable extension</strong>
            <small>Turning this off clears predictions and disables all skipping. Errors never stop playback.</small>
          </span>
          <input id="enabled" type="checkbox">
        </label>

        <fieldset>
          <legend>Skip policy</legend>
          <label class="choice">
            <input type="radio" name="sensitivity" value="conservative">
            <span>
              <strong>Conservative</strong>
              <small>Preview stricter promotional candidates. Recommended.</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="sensitivity" value="aggressive">
            <span>
              <strong>Aggressive</strong>
              <small>Preview more ambiguous candidates. Heuristic scores are not probabilities.</small>
            </span>
          </label>
        </fieldset>

        <label class="toggle-row">
          <span>
            <strong>Show status notifications</strong>
            <small>Optional status messages. Experimental skips always show an Undo action.</small>
          </span>
          <input id="show-notifications" type="checkbox">
        </label>

        <details>
          <summary>Development</summary>
          <label class="toggle-row development-option">
            <span>
              <strong>Use manual playback fixtures</strong>
              <small>Loads tune-split labels after 1.5 seconds. These are test data, not detections.</small>
            </span>
            <input id="development-fixtures" type="checkbox">
          </label>
          <label class="toggle-row development-option">
            <span>
              <strong>Probe captions from the watch page</strong>
              <small>Development-only and off by default. Does not open the transcript panel or enable detector skips.</small>
            </span>
            <input id="development-browser-acquisition" type="checkbox">
          </label>
          <label class="stacked" for="backend-url">
            <strong>Backend URL</strong>
            <input id="backend-url" type="url" required>
            <small>Preview uses only http://127.0.0.1:8000 or http://localhost:8000.</small>
          </label>
        </details>

        <div class="actions">
          <button type="submit">Save settings</button>
          <button id="reset" type="button" class="secondary">Reset</button>
          <output id="status" aria-live="polite"></output>
        </div>
      </form>
    </main>
    <script src="defaults.js"></script>
    <script src="preview-contract.js"></script>
    <script src="options.js"></script>
  </body>
</html>
