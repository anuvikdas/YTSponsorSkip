<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YTSponsorSkip</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-page">
    <main>
      <p class="eyebrow">YTSponsorSkip</p>
      <h1 id="popup-title">Current video</h1>
      <p id="preview-banner" class="preview-warning" hidden>Preview only — automatic skipping off</p>
      <p id="current-status" class="status-card">Checking status…</p>
      <div id="preview-details" hidden>
        <p id="preview-source" class="preview-meta"></p>
        <ol id="preview-intervals"></ol>
        <p id="preview-timing" class="preview-meta"></p>
      </div>
      <button id="open-options" type="button">Settings</button>
    </main>
    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
